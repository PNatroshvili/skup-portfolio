name: Lukma Web Build Check

on:
  push:
    branches: ["feat/skup-web-platform-v1"]
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: lukma-web-build-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Show resolved lockfile diff
        run: git diff -- package-lock.json
      - run: npm run build
      - run: npm run lint
      - name: Report dependency audit
        run: |
          npm audit --json > audit.json || true
          node - <<'NODE'
          const audit = require("./audit.json");
          const format = (label, data) => console.log(label, JSON.stringify(Object.entries(data || {}).map(([name, item]) => ({
            name,
            severity: item.severity,
            via: item.via,
            fixAvailable: item.fixAvailable
          })), null, 2));
          format("FULL_AUDIT", audit.vulnerabilities);
          NODE
